name: CI

on: [push, pull_request]

jobs:
  lint-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/kaladron/cpp-image/dev-env:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y libsqlite3-dev
          git config --global --add safe.directory '*'
          ln -sf /usr/bin/clang-format-22 /usr/bin/clang-format
          mkdir -p /lib/share/libc++
          ln -sf /usr/lib/llvm-22/share/libc++/v1 /lib/share/libc++/v1

      - name: Check readonly iterator usage
        run: |
          if find gb -type f \( -name '*.cc' -o -name '*.cppm' -o -name '*.h' \) \
            -exec grep -nHE 'const (RaceList|StarList|PlanetList|CommodList)\b' {} +; then
            echo "❌ Read-only entity iteration should use XxxList::readonly(...), not const XxxList."
            echo ""
            echo "Update the matching loops to use one of:"
            echo "  RaceList::readonly(em)"
            echo "  StarList::readonly(em)"
            echo "  PlanetList::readonly(em, star_id, star)"
            echo "  CommodList::readonly(em)"
            exit 1
          fi
          echo "✅ Read-only entity list usage is correct"

      - name: Configure CMake
        run: cmake -S . -G Ninja -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++-22

      - name: Check code formatting
        run: |
          ninja -C build format
          if ! git diff --quiet; then
            echo "❌ Code formatting issues detected!"
            echo ""
            echo "To fix formatting, run:"
            echo "  ninja -C build format-fix"
            echo ""
            echo "Files that need formatting:"
            git diff --name-only
            echo ""
            echo "💡 Tip: Install pre-commit hooks to catch this locally:"
            echo "  ./tools/install-hooks.sh"
            exit 1
          fi
          echo "✅ Code formatting is correct"

  static-analysis:
    name: Static Analysis (Clang-Tidy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/kaladron/cpp-image/dev-env:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y libsqlite3-dev clang-tidy-22
          git config --global --add safe.directory '*'
          ln -sf /usr/bin/ld.lld-22 /usr/bin/ld.lld
          ln -sf /usr/bin/lld-22 /usr/bin/lld
          ln -sf /usr/bin/clang-scan-deps-22 /usr/bin/clang-scan-deps
          ln -sf /usr/bin/run-clang-tidy-22 /usr/bin/run-clang-tidy || true
          mkdir -p /lib/share/libc++
          ln -sf /usr/lib/llvm-22/share/libc++/v1 /lib/share/libc++/v1

      - name: Configure CMake
        run: cmake -S . -G Ninja -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++-22

      - name: Run Clang-Tidy on Changed Files
        run: |
          ./tools/tidy-changed.sh origin/main

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/kaladron/cpp-image/dev-env:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y libsqlite3-dev
          git config --global --add safe.directory '*'
          ln -sf /usr/bin/ld.lld-22 /usr/bin/ld.lld
          ln -sf /usr/bin/lld-22 /usr/bin/lld
          ln -sf /usr/bin/clang-scan-deps-22 /usr/bin/clang-scan-deps
          mkdir -p /lib/share/libc++
          ln -sf /usr/lib/llvm-22/share/libc++/v1 /lib/share/libc++/v1

      - name: Configure CMake
        run: cmake -S . -G Ninja -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++-22

      - name: Build
        run: cmake --build build

      - name: Test
        working-directory: build
        run: ctest --output-on-failure

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/kaladron/cpp-image/dev-env:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y libsqlite3-dev llvm-22
          git config --global --add safe.directory '*'
          ln -sf /usr/bin/ld.lld-22 /usr/bin/ld.lld
          ln -sf /usr/bin/lld-22 /usr/bin/lld
          ln -sf /usr/bin/clang-scan-deps-22 /usr/bin/clang-scan-deps
          ln -sf /usr/bin/llvm-profdata-22 /usr/bin/llvm-profdata || true
          ln -sf /usr/bin/llvm-cov-22 /usr/bin/llvm-cov || true
          mkdir -p /lib/share/libc++
          ln -sf /usr/lib/llvm-22/share/libc++/v1 /lib/share/libc++/v1

      - name: Configure CMake with Coverage
        run: cmake -S . -G Ninja -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++-22 -DENABLE_COVERAGE=ON

      - name: Build
        run: cmake --build build

      - name: Run Tests with Profiling
        working-directory: build
        env:
          LLVM_PROFILE_FILE: "coverage-%p.profraw"
        run: ctest --output-on-failure

      - name: Generate Coverage Report
        run: |
          llvm-profdata merge -sparse build/coverage-*.profraw -o build/coverage.profdata
          
          # Find all test executables
          TEST_BINARIES=$(find build/gb -maxdepth 1 -type f -executable ! -name "*.so" ! -name "*.a")
          FIRST_BIN=$(echo "$TEST_BINARIES" | head -n 1)
          EXTRA_BINS=$(echo "$TEST_BINARIES" | tail -n +2 | sed 's/^/-object /' | tr '\n' ' ')
          
          echo "### 📊 Code Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          llvm-cov report "$FIRST_BIN" $EXTRA_BINS -instr-profile=build/coverage.profdata -ignore-filename-regex='(build/|third_party/|_test\.cc)' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
