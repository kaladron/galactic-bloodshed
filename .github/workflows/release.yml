name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish formal GitHub Release (set false for dry-run)'
        required: true
        type: boolean
        default: true

env:
  LLVM_VERSION: "22"

permissions:
  contents: write       # Create GitHub Release and upload assets
  id-token: write       # Generate Sigstore OIDC tokens
  attestations: write   # Record Sigstore provenance attestations

jobs:
  build-and-package:
    name: Build, Package & Attest
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kaladron/cpp-image/dev-env:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Full history so git describe resolves release tags

      - name: Configure Toolchain Symlinks & Dependencies
        run: |
          apt-get update
          apt-get install -y libsqlite3-dev file dpkg-dev
          git config --global --add safe.directory '*'
          ln -sf "/usr/bin/ld.lld-${LLVM_VERSION}" /usr/bin/ld.lld
          ln -sf "/usr/bin/lld-${LLVM_VERSION}" /usr/bin/lld
          ln -sf "/usr/bin/clang-scan-deps-${LLVM_VERSION}" /usr/bin/clang-scan-deps
          mkdir -p /lib/share/libc++
          ln -sf "/usr/lib/llvm-${LLVM_VERSION}/share/libc++/v1" /lib/share/libc++/v1

      - name: Configure CMake (Release)
        run: |
          cmake -S . -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_C_COMPILER="clang-${LLVM_VERSION}" \
            -DCMAKE_CXX_COMPILER="clang++-${LLVM_VERSION}"

      - name: Build
        run: cmake --build build

      - name: Run Test Suite
        working-directory: build
        run: ctest --output-on-failure

      - name: Create Debian Package (.deb)
        run: |
          (cd build && cpack -G DEB)
          mkdir -p dist
          cp build/*.deb dist/

      - name: Verify Debian Package Contents
        run: |
          DEB_FILE=$(ls dist/*.deb | head -n 1)
          echo "📦 Verifying package contents for: ${DEB_FILE}"
          
          # Check executables
          dpkg -c "${DEB_FILE}" | grep -q "./usr/bin/GB" || { echo "❌ Missing /usr/bin/GB"; exit 1; }
          dpkg -c "${DEB_FILE}" | grep -q "./usr/bin/makeuniv" || { echo "❌ Missing /usr/bin/makeuniv"; exit 1; }
          
          # Check star and planet lists
          dpkg -c "${DEB_FILE}" | grep -q "./usr/share/galactic-bloodshed/star.list" || { echo "❌ Missing star.list"; exit 1; }
          dpkg -c "${DEB_FILE}" | grep -q "./usr/share/galactic-bloodshed/planet.list" || { echo "❌ Missing planet.list"; exit 1; }
          
          # Check help manuals
          HELP_COUNT=$(dpkg -c "${DEB_FILE}" | grep -c "./usr/share/galactic-bloodshed/help/.*\.md" || true)
          echo "Found ${HELP_COUNT} help files in package."
          if [ "${HELP_COUNT}" -lt 100 ]; then
            echo "❌ Help files incomplete in debian package (expected > 100, got ${HELP_COUNT})"
            exit 1
          fi
          
          # Check state directory
          dpkg -c "${DEB_FILE}" | grep -q "./var/lib/galactic-bloodshed" || { echo "❌ Missing /var/lib/galactic-bloodshed"; exit 1; }
          
          echo "✅ All essential executables, catalogs, help manuals, and state paths verified."

      - name: Create Binary and Source Tarballs (.tar.gz)
        run: |
          # Binary tarball
          (cd build && cpack -G TGZ)
          cp build/*-Linux-*.tar.gz dist/

          # Source tarball (embed VERSION so offline builds preserve SemVer)
          git describe --tags --always > VERSION
          cpack --config build/CPackSourceConfig.cmake
          mv galactic-bloodshed-*-source.tar.gz dist/ 2>/dev/null || mv build/galactic-bloodshed-*-source.tar.gz dist/ 2>/dev/null || true

      - name: Generate SPDX SBOM (Syft)
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          DEB_PKG=$(ls dist/*.deb | head -n 1)
          syft scan "file:${DEB_PKG}" -o spdx-json=dist/galactic-bloodshed-sbom.spdx.json

      - name: Generate Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.deb
            dist/*.tar.gz

      - name: Attest SBOM
        uses: actions/attest-sbom@v2
        with:
          subject-path: 'dist/*.deb'
          sbom-path: 'dist/galactic-bloodshed-sbom.spdx.json'

      - name: Upload Build Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: release-dist-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error

      - name: Publish GitHub Release Assets
        if: github.event_name == 'push' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.tar.gz
            dist/*.spdx.json
            dist/SHA256SUMS
          generate_release_notes: true
