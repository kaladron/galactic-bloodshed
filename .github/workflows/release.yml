name: Release

on:
  push:
    branches:
      - 'release/**'
      - 'release/*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version override (e.g. 1.0.0)'
        required: false
        default: ''

jobs:
  package-release:
    name: Package Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/kaladron/cpp-image/dev-env:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine Release Version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#release/}"
            VERSION="${VERSION#v}"
          fi
          echo "RELEASE_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Building release version: ${VERSION}"

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y libsqlite3-dev file dpkg-dev
          git config --global --add safe.directory '*'
          ln -sf /usr/bin/ld.lld-22 /usr/bin/ld.lld
          ln -sf /usr/bin/lld-22 /usr/bin/lld
          ln -sf /usr/bin/clang-scan-deps-22 /usr/bin/clang-scan-deps
          mkdir -p /lib/share/libc++
          ln -sf /usr/lib/llvm-22/share/libc++/v1 /lib/share/libc++/v1

      - name: Configure CMake (Release)
        run: |
          cmake -S . -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_C_COMPILER=clang-22 \
            -DCMAKE_CXX_COMPILER=clang++-22 \
            -DCPACK_PACKAGE_VERSION="${RELEASE_VERSION}"

      - name: Build
        run: cmake --build build

      - name: Test
        working-directory: build
        run: ctest --output-on-failure

      - name: Create Release Packages (Tarballs & .deb)
        run: |
          # Generate binary tarball and debian package
          (cd build && cpack -G "TGZ;DEB")
          
          # Generate source release tarball
          cpack --config build/CPackSourceConfig.cmake
          mv galactic-bloodshed-*-source.tar.gz build/ 2>/dev/null || true

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ env.RELEASE_VERSION }}
          path: |
            build/*.tar.gz
            build/*.deb
          if-no-files-found: error
